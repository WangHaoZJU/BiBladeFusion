project:
  data_root: data
  log_root: logs

# The following robot addresses and SDK path are the current laboratory bring-up values.
# Keep them for this rig. Before public release, move machine-specific values to the
# Git-ignored configs/local.yaml and remove them from distributable defaults.
robot:
  model: es68
  robot_ip: 192.168.6.60
  local_ip: 192.168.6.29
  sdk_import_path: elite_cs_sdk
  headless_mode: true
  motion_enabled: false
  script_file_path: null
  reverse_port: 50002
  script_sender_port: 50001
  trajectory_port: 50003
  script_command_port: 50004
  servoj_time_s: 0.004
  servoj_lookahead_time_s: 0.1
  servoj_gain: 2000
  stopj_acceleration_rad_s2: 2.0
  default_speed_scaling: 0.3
  maximum_speed_scaling: 1.0
  default_motion_timeout_s: 15.0
  maximum_motion_timeout_s: 60.0
  motion_poll_period_s: 0.01
  default_trajectory_time_s: 3.0
  default_blend_radius_m: 0.0
  rtsi_frequency_hz: 125.0
  settle_time_s: 1.0
  sdk_wheel: /home/vale/Documents/Elite_Robots_CS_SDK_Python/dist/elite_cs_sdk-1.0.0-cp312-cp312-linux_x86_64.whl

realsense:
  serial_number: null
  infrared_width: 1280
  infrared_height: 720
  frames_per_second: 30
  enable_native_depth: true
  warmup_frames: 15
  timeout_ms: 5000
  # Keep the D435i projector off while detecting the printed ChArUco target.
  infrared_emitter_enabled: false
  # `bbf calibration stereo-gui` updates this runtime copy automatically.
  stereo_calibration_path: data/calibrations/d435i_ir_active.yaml

thermal:
  # Interface placeholder only: no radiometric hardware adapter or fusion path exists yet.
  enabled: false
  driver: null

acquisition:
  max_bracket_ms: 250.0
  max_joint_delta_rad: 0.001
  max_tcp_translation_delta_m: 0.0005
  max_tcp_rotation_delta_rad: 0.001

foundation_stereo:
  repository_path: third_party/FoundationStereo
  checkpoint_path: models/foundation_stereo/23-51-11/model_best_bp2.pth
  # null resolves to cfg.yaml beside checkpoint_path, matching the official release.
  model_config_path: null
  device: cuda
  scale: 1.0
  valid_iterations: 32
  hierarchical: false
  remove_invisible: true
  left_right_consistency_threshold_px: 1.0

stereo_rectification:
  alpha: 0.0
  zero_disparity: true
  interpolation: linear

# The thickness must be measured or conservatively estimated before constructing a
# bilateral proxy. Planar extents are optional because a good initial view observes them.
proxy_model:
  voxel_size_m: 0.002
  minimum_points: 100
  estimated_planar_extents_m: null
  estimated_thickness_m: null
  tangential_margin_m: 0.01
  visible_side_margin_m: 0.003
  hidden_side_margin_m: 0.005
  minimum_camera_normal_cosine: 0.2
  # Production unknown-blade scans require all three measured values. The AABB
  # is expressed in base and filters every coarse view before proxy/PCA, coverage,
  # fusion, TSDF and partitioning; raw hard-ROI clouds remain immutable. Null
  # defaults keep unmeasured geometry fail-closed.
  blade_envelope_min_m: null
  blade_envelope_max_m: null
  minimum_envelope_retained_fraction: null

point_cloud:
  minimum_depth_m: 0.15
  maximum_depth_m: 1.5
  pixel_stride: 1
  minimum_valid_points: 100

# Before a schema-5 coarse blade surface exists, select a single interior depth
# component from the first FoundationStereo observation. Components reaching the
# valid-depth boundary and ambiguous unseeded scenes fail closed. A persisted
# rectangle/polygon may be used as a hard ROI or component hint. No erosion is used,
# because the specimen's thin fin and edge support must survive initialization.
# These thresholds are software starting values and remain hardware-acceptance items.
bootstrap_foreground:
  minimum_depth_m: 0.15
  maximum_depth_m: 2.0
  maximum_neighbour_depth_jump_m: 0.030
  maximum_neighbour_relative_depth_jump: 0.035
  connectivity: 8
  boundary_margin_px: 2
  minimum_valid_pixels: 1000
  minimum_component_pixels: 100
  minimum_mask_pixels: 500
  minimum_mask_fraction: 0.001
  maximum_mask_fraction: 0.70
  maximum_unseeded_ambiguity_ratio: 0.35
  minimum_seed_valid_pixels: 25
  minimum_seed_valid_fraction: 0.10
  minimum_component_hint_selection_fraction: 0.10

# Fine-scan science reconstruction projects one explicitly pinned immutable schema-5
# coarse surface into left_rectified. Enabling this block is insufficient by itself:
# the supervised composition root must also pass that exact reference (and, for recovery,
# an exact accepted coverage generation) to the cycle engine. The unknown-blade runtime
# enables this only after its coarse generation is promoted to an immutable schema-5 asset.
# The eligible mask comes from the same FoundationStereo quality/range/robot-self-mask
# gate used for occupancy, but science then keeps only depth consistent with the blade
# reference. Safety occupancy still consumes every eligible scene depth, including
# non-blade obstacles. Distances/tolerances are metres; projection radius is pixels.
# A target patch counts only where it wins the complete coarse-surface z-buffer and
# its outward normal faces the camera above minimum_target_incidence_cosine; this
# prevents millimetre-separated front/back surfaces from satisfying each other's gate.
# No connected-component filtering or erosion is applied, to avoid deleting thin fins
# and one-pixel boundary evidence. These defaults are software starting values, not
# physically validated D435i thresholds.
blade_foreground:
  enabled: false
  method: reference_projected
  # Coarse samples are circularly splatted, not triangle-rasterised. This radius is a
  # software starting value and must be accepted against projected sampling gaps at the
  # real blade standoffs; it is not a continuous-occlusion guarantee.
  projection_radius_px: 3
  minimum_projection_depth_m: 0.05
  maximum_projection_depth_m: 3.0
  front_depth_tolerance_m: 0.006
  back_depth_tolerance_m: 0.010
  minimum_target_incidence_cosine: 0.10
  minimum_reference_pixels: 30
  minimum_target_reference_pixels: 6
  minimum_mask_pixels: 30
  minimum_target_mask_pixels: 3
  minimum_reference_match_fraction: 0.05
  minimum_target_match_fraction: 0.05
  minimum_mask_fraction: 0.0001
  maximum_mask_fraction: 0.80

hand_eye:
  # The GUI publishes here automatically only after held-out validation passes.
  calibration_path: data/calibrations/es68_left_ir_hand_eye_active.yaml
  minimum_samples: 15
  maximum_translation_rmse_m: 0.002
  maximum_rotation_rmse_deg: 0.5
  minimum_rotation_span_deg: 20.0
  minimum_translation_span_m: 0.03
  minimum_rotation_axis_diversity: 0.1
  # RTSI TCP is validation-only: calibrated FK·flange_T_tcp must agree before capture.
  maximum_fk_tcp_translation_error_m: 0.002
  maximum_fk_tcp_rotation_error_deg: 0.3
  minimum_novel_translation_m: 0.01
  minimum_novel_rotation_deg: 5.0
  validation_minimum_samples: 5
  validation_maximum_translation_rmse_m: 0.003
  validation_maximum_rotation_rmse_deg: 0.5
  validation_maximum_reprojection_rmse_px: 0.8
  require_quality_metrics: true
  require_observability_metrics: true
  initial_method: park
  enable_bundle_adjustment: true
  target:
    squares_x: 14
    squares_y: 9
    square_length_m: 0.020
    marker_length_m: 0.015
    dictionary: DICT_5X5_100
    legacy_pattern: false
    minimum_corners: 24
    maximum_reprojection_rmse_px: 0.8
    minimum_pose_ambiguity_ratio: 1.5
    detector_params:
      cornerRefinementMethod: 2
      adaptiveThreshWinSizeMin: 3
      adaptiveThreshWinSizeMax: 43
      adaptiveThreshWinSizeStep: 4

view_planning:
  # Left-IR optical-centre-to-patch-centre baseline. It remains null until the
  # real distance/accuracy experiment establishes a defensible value.
  standoff_distance_m: null
  # Fine views search per region around the baseline. Bounds must be supplied
  # together from the validated sensor/accuracy and workcell-clearance envelope.
  adaptive_standoff_enabled: true
  minimum_standoff_distance_m: null
  maximum_standoff_distance_m: null
  distance_search_step_m: 0.01
  overlap_fraction: 0.3
  footprint_utilization: 0.8
  image_edge_margin_px: 40
  minimum_patch_projection_fraction: 1.0
  minimum_patch_visibility_fraction: 0.90
  occlusion_depth_tolerance_m: 0.003
  maximum_visibility_split_depth: 2
  edge_margin_m: 0.005
  maximum_candidates: 200

view_filter:
  # Endpoint feasibility remains geometry-only until workspace and an IK checker exist.
  workspace: null
  forbidden_volumes: []
  camera_clearance_radius_m: 0.05
  minimum_look_at_cosine: 0.999
  minimum_incidence_cosine: 0.95
  maximum_standoff_error_m: 0.005
  duplicate_translation_tolerance_m: 0.005
  duplicate_rotation_tolerance_deg: 2.0

coverage:
  bins_per_axis: 8
  minimum_points_per_bin: 2
  completed_fraction: 0.8
  maximum_surface_distance_m: 0.02
  minimum_camera_side_offset_m: 0.02
  minimum_surface_points_per_view: 50

# Coarse-scan fusion keeps the robot/hand-eye pose as a strong prior. Residual ICP is
# bounded and performed only between observations assigned to the same blade side.
multi_view_fusion:
  voxel_size_m: 0.0015
  maximum_icp_points: 2500
  icp_iterations: 12
  maximum_correspondence_distance_m: 0.012
  minimum_correspondences: 80
  pose_prior_weight: 0.25
  maximum_translation_correction_m: 0.008
  maximum_rotation_correction_deg: 1.5
  normal_neighbors: 16

# Paper-derived true-surface partitioning. The usable footprint is the conservative
# workpiece-plane footprint after FOV, standoff, accuracy, and edge margins.
surface_partition:
  voxel_size_m: 0.0015
  maximum_points_per_side: 6000
  minimum_points_per_side: 150
  normal_neighbors: 16
  angle_criterion_threshold_deg: 90.0
  # AC candidates are ordered into a closed contour, divided at four topological
  # junctions, and fitted by endpoint-consistent robust cubic B-splines.
  boundary_curve_enabled: true
  # If real data cannot support four reliable curves, retain the earlier section-line
  # parameterization but record the fallback in the artifact metadata.
  boundary_allow_fallback: true
  boundary_angular_bins: 180
  boundary_min_points_per_curve: 10
  boundary_control_points: 10
  boundary_robust_iterations: 6
  boundary_smoothing_lambda: 0.1
  boundary_huber_delta_m: 0.003
  boundary_max_fit_rmse_m: 0.006
  boundary_min_inlier_fraction: 0.70
  boundary_band_fraction: 0.08
  overlap_fraction: 0.30
  # Production planning derives the footprint from calibrated left-IR intrinsics
  # and view_planning.standoff_distance_m. No fixed 80x60 mm fallback is allowed.
  derive_footprint_from_intrinsics: true
  usable_footprint_m: null
  minimum_patch_points: 24
  curvature_split_threshold_deg: 8.0
  maximum_adaptive_depth: 2
  normal_azimuth_bins: 24
  normal_elevation_bins: 12
  # This specimen has exactly one protruding fin in each main-blade half-space.
  # Detection is fail-closed so a fin cannot silently contaminate the main outline.
  fin_mode: required_single_per_side
  fin_height_fit_iterations: 6
  fin_height_huber_delta_m: 0.003
  fin_main_normal_min_cosine: 0.70
  fin_seed_max_normal_cosine: 0.55
  fin_seed_min_height_m: 0.008
  fin_grow_min_height_m: 0.0025
  fin_connectivity_radius_m: 0.006
  fin_minimum_points: 36
  fin_minimum_span_m: 0.012
  fin_maximum_thickness_ratio: 0.35
  fin_maximum_secondary_fraction: 0.35
  fin_root_band_m: 0.006
  fin_free_edge_band_m: 0.006
  fin_face_min_separation_m: 0.0015
  fin_root_view_main_weight: 0.75

# Front and back are integrated independently so their truncation bands cannot erase a
# wall thinner than twice the nominal TSDF truncation distance.
tsdf:
  voxel_size_m: 0.0015
  truncation_distance_m: 0.006
  minimum_weight: 1.0
  maximum_voxels: 2000000
  use_open3d_if_available: true
  thin_wall_band_fraction: 0.40

surface_quality:
  maximum_surface_distance_m: 0.004
  minimum_incidence_cosine: 0.35
  completed_fraction: 0.85
  maximum_rmse_m: 0.003
  minimum_normal_consistency: 0.75
  # This absolute floor is capped by each topology/visibility patch's own reference
  # sample count; completed_fraction, RMSE, and normal consistency remain mandatory.
  minimum_observed_points: 30

next_view_selection:
  # Completion requires every listed region on both main blade sides.  The two
  # protruding fins must each have independently observed face geometry.
  required_regions:
    [surface, leading_edge, trailing_edge, root, tip, fin_face, fin_root, fin_free_edge]
  region_priority:
    [fin_root, fin_free_edge, leading_edge, trailing_edge, root, tip, fin_face, surface]
  require_each_region_on_both_blade_sides: true
  require_two_observed_fin_faces_per_side: true
  exclude_already_captured_candidate_ids: true
  use_joint_travel_only_as_tiebreak: true
  # If a nominal patch view is accepted scientifically but still fails the patch
  # quality gates, try only these three deterministic target-centred orbits.  Every
  # retry receives a new immutable view ID and still passes workspace/IK/FK here and
  # swept occupancy/collision preflight downstream.
  maximum_reacquisition_attempts_per_patch: 3
  reacquisition_perturbations:
    - {distance_offset_m: 0.000, tilt_deg: 6.0, azimuth_deg: 0.0}
    - {distance_offset_m: 0.020, tilt_deg: 8.0, azimuth_deg: 120.0}
    - {distance_offset_m: -0.020, tilt_deg: 10.0, azimuth_deg: -120.0}

depth_comparison:
  minimum_overlap_points: 100
  # Report the fraction of shared blade pixels agreeing within each metric threshold.
  agreement_thresholds_m: [0.005, 0.01, 0.02]
  minimum_camera_side_offset_m: 0.02
  incidence_bin_edges_deg: [0, 15, 30, 45, 60, 75, 90]

# Current schema-2 static-scene validation uses authoritative calibrated FK:
# FK(joints + zero offsets) · flange_T_left_ir · left_ir_T_depth.
# Synchronized controller TCP is validation-only. The retained 2026-08-27 schema-1 result
# is a legacy TCP-primary baseline and must not be relabelled as current FK-chain evidence.
# Primary metrics are symmetric projective depth residuals and never use ICP.
native_overlap_validation:
  minimum_views: 3
  minimum_depth_m: 0.25
  maximum_depth_m: 0.75
  pixel_stride: 2
  edge_window_radius_px: 1
  maximum_local_depth_range_m: 0.010
  maximum_surface_residual_m: 0.020
  minimum_projected_points: 1000
  minimum_surface_inlier_fraction: 0.95
  agreement_thresholds_m: [0.002, 0.005]
  maximum_median_absolute_error_m: 0.002
  maximum_root_mean_square_error_m: 0.003
  maximum_p95_absolute_error_m: 0.006
  minimum_five_mm_agreement_fraction: 0.90
  minimum_translation_span_m: 0.03
  minimum_rotation_span_deg: 5.0
  diagnostic_icp_enabled: true
  diagnostic_icp_voxel_size_m: 0.005
  diagnostic_icp_maximum_points: 1200
  diagnostic_icp_iterations: 8
  diagnostic_icp_maximum_correspondence_m: 0.020
  diagnostic_icp_minimum_correspondences: 100
  diagnostic_icp_normal_neighbors: 12
  diagnostic_icp_pose_prior_weight: 0.05
  overlay_voxel_size_m: 0.004
  maximum_overlay_points_per_view: 30000

kinematics:
  model_path: null
  plugin_path: null
  primary_timeout_ms: 1000
  ik_timeout_s: 0.05
  # Stage 1 keeps HoloRobot's calibrated ES68 chain fixed and applies no new zero offsets.
  joint_zero_offsets_rad: [0, 0, 0, 0, 0, 0]

# Collision validation refuses to run until measured/conservative geometry and joint
# limits are supplied in configs/local.yaml. Capsule 0 starts at the robot base;
# capsule 6 spans the flange/TCP to the camera center.
collision:
  link_radii_m: null
  camera_tool_radius_m: null
  minimum_joint_positions_rad: null
  maximum_joint_positions_rad: null
  obstacles: []
  require_obstacles: false
  minimum_clearance_m: 0.01
  maximum_joint_step_rad: 0.02

# HoloRobot-derived motion-preflight contract. Production eligibility requires independent
# conservative continuous mesh/FCL and robot-versus-voxel interval certificates. Failure to
# prove a complete interval is UNKNOWN and blocks; discrete samples are diagnostic only.
motion_preflight:
  maximum_joint_step_rad: 0.02
  servoj_dt_s: 0.004
  speed_scaling: 0.08
  velocity_margin: 0.8
  # Every stored IK endpoint must reproduce its requested base_T_tcp under the calibrated
  # ES68 FK and packaged flange_T_tcp before any future approval-eligible stream exists.
  maximum_endpoint_translation_error_m: 0.002
  maximum_endpoint_rotation_error_deg: 0.3
  # Immutable physical measurements for following error + stop drift. Both values
  # remain null until the final ES68/D435i assembly is accepted on the target workcell.
  motion_envelope_acceptance_path: null
  motion_envelope_acceptance_id: null

# Immutable physical release evidence for the exact geometry-science contract.
# Both fields remain null until the target workcell has passed acceptance.
science_acceptance:
  path: null
  acceptance_id: null

# Deterministic coarse-scan completion and bilateral fin-discovery policy. These
# defaults exactly mirror CoarseSciencePolicy; production code must consume this
# configuration rather than instantiate an independent implicit policy.
coarse_science:
  discovery_tilt_deg: 15.0
  minimum_total_views: 6
  minimum_views_per_side: 3
  maximum_attempts_per_candidate: 2
  require_complete_proxy_coverage: true
  maximum_discovery_translation_error_m: 0.020
  maximum_discovery_rotation_error_deg: 5.0

# Terminal fine-reconstruction gates. These are software defaults, not measured
# accuracy claims; the science acceptance asset must bind the deployed experiment.
fine_finalization:
  minimum_source_views_per_side: 1
  minimum_mesh_triangles_per_side: 1
  maximum_mesh_boundary_edges: 0
  maximum_mesh_boundary_loops: 0
  require_watertight_mesh: true
  require_two_face_fin_per_side: true
  require_fin_regions_complete: true

# Receding-horizon coordinator: stop/settle, capture, FoundationStereo, publish one
# immutable occupancy generation, preflight exactly one short segment, approve, move,
# and stop again. It remains disabled until the segment bound and workcell are accepted.
stop_and_capture:
  enabled: false
  depth_backend: foundation_stereo
  bootstrap_mode: operator_guided
  maximum_segment_joint_delta_rad: null
  settle_timeout_s: 15.0
  settle_poll_period_s: 0.05
  maximum_robot_state_staleness_s: 0.25
  maximum_goal_joint_error_rad: 0.01
  execution_freshness_margin_s: 1.0
  # These four bounds must come from measurements on the deployed GPU,
  # controller and workcell. Null keeps the production entry fail-closed.
  maximum_perception_cycle_duration_s: null
  maximum_operator_reposition_interval_s: null
  maximum_segment_execution_duration_s: null
  # Measured upper bound for stop-coarse/checkpoint/schema-5 promotion/fine handoff.
  maximum_schema5_handoff_duration_s: null
  runtime_timing_acceptance_path: null
  runtime_timing_acceptance_id: null
  require_operator_approval: true
  require_capture_after_every_segment: true

# Unknown-blade safety mapping. Enable only after measuring the workcell bounds and
# validating the final ES68+D435i robot self-filter. UNKNOWN and stale maps block motion.
# Numeric defaults below are software/test starting points, not hardware-accepted safety
# values; physical release requires recorded workcell-specific acceptance experiments.
occupancy:
  enabled: false
  frame_id: base
  mapping_mode: stop_and_capture
  voxel_size_m: 0.01
  workspace_bounds_min_m: null
  workspace_bounds_max_m: null
  minimum_depth_m: 0.15
  maximum_depth_m: 1.5
  integration_stride: 2
  free_space_margin_m: 0.01
  obstacle_inflation_m: 0.01
  # Null means the published generation remains current until the next accepted
  # stop-and-capture generation replaces it atomically.
  maximum_map_age_s: null
  unknown_policy: block
  require_robot_self_mask: true
  # Optional hardware-accepted base-frame regions known to contain no external
  # object. They are not generic UNKNOWN exemptions: only a complete voxel cell
  # inside one accepted AABB may be treated as accepted-static-free, while an
  # OCCUPIED vote always wins. Keep empty until a separately archived acceptance
  # record has been completed; its SHA-256 becomes the acceptance ID.
  accepted_static_free_aabbs: []
  accepted_static_free_acceptance_id: null
  accepted_static_free_acceptance_path: null
  self_mask_front_tolerance_m: 0.01
  self_mask_back_tolerance_m: 0.02
  self_mask_dilation_px: 1
  # Every safety frame must agree with HoloRobot ES68 FK and the fitted
  # flange-to-controller-TCP transform before its rays enter the base-frame map.
  maximum_fk_tcp_translation_error_m: 0.002
  maximum_fk_tcp_rotation_error_deg: 0.3
  minimum_valid_depth_fraction: 0.05
  # Deterministic exp(-LR disparity error / LR threshold), not a calibrated probability.
  minimum_stereo_confidence: 0.5
  maximum_lr_consistency_error_px: 1.0
  minimum_source_views: 3
  # Safety occupancy is a bounded rolling generation; cumulative scientific
  # coverage is stored separately and is never truncated by this value.
  maximum_source_views: 3
  # A voxel remains UNKNOWN until this many independent captured views vote FREE.
  minimum_free_observations: 3
  # A new FREE-supporting view must differ from every accepted view by at least
  # one of these base-frame camera-pose thresholds.
  minimum_free_view_translation_m: 0.02
  minimum_free_view_direction_deg: 5.0
  maximum_grid_voxels: 8000000
