project:
  data_root: data
  log_root: logs

robot:
  model: es68
  robot_ip: null
  local_ip: null
  sdk_import_path: elite_cs_sdk
  headless_mode: true
  motion_enabled: false
  script_file_path: null
  reverse_port: 50002
  script_sender_port: 50001
  trajectory_port: 50003
  script_command_port: 50004
  servoj_time_s: 0.004
  servoj_lookahead_time_s: 0.1
  servoj_gain: 2000
  stopj_acceleration_rad_s2: 2.0
  default_speed_scaling: 0.3
  maximum_speed_scaling: 1.0
  default_motion_timeout_s: 15.0
  maximum_motion_timeout_s: 60.0
  motion_poll_period_s: 0.01
  default_trajectory_time_s: 3.0
  default_blend_radius_m: 0.0
  rtsi_frequency_hz: 125.0
  settle_time_s: 1.0
  sdk_wheel: /home/vale/Documents/Elite_Robots_CS_SDK_Python/dist/elite_cs_sdk-1.0.0-cp312-cp312-linux_x86_64.whl

realsense:
  serial_number: null
  infrared_width: 1280
  infrared_height: 720
  frames_per_second: 30
  enable_native_depth: true
  warmup_frames: 15
  timeout_ms: 5000
  # Keep the D435i projector off while detecting the printed ChArUco target.
  infrared_emitter_enabled: false
  # `bbf calibration stereo-gui` updates this runtime copy automatically.
  stereo_calibration_path: data/calibrations/d435i_ir_active.yaml

thermal:
  enabled: false
  driver: null

acquisition:
  max_bracket_ms: 250.0
  max_joint_delta_rad: 0.001
  max_tcp_translation_delta_m: 0.0005
  max_tcp_rotation_delta_rad: 0.001

foundation_stereo:
  repository_path: third_party/FoundationStereo
  checkpoint_path: models/foundation_stereo/23-51-11/model_best_bp2.pth
  # null resolves to cfg.yaml beside checkpoint_path, matching the official release.
  model_config_path: null
  device: cuda
  scale: 1.0
  valid_iterations: 32
  hierarchical: false
  remove_invisible: true

stereo_rectification:
  alpha: 0.0
  zero_disparity: true
  interpolation: linear

# The thickness must be measured or conservatively estimated before constructing a
# bilateral proxy. Planar extents are optional because a good initial view observes them.
proxy_model:
  voxel_size_m: 0.002
  minimum_points: 100
  estimated_planar_extents_m: null
  estimated_thickness_m: null
  tangential_margin_m: 0.01
  visible_side_margin_m: 0.003
  hidden_side_margin_m: 0.005
  minimum_camera_normal_cosine: 0.2

point_cloud:
  minimum_depth_m: 0.15
  maximum_depth_m: 1.5
  pixel_stride: 1
  minimum_valid_points: 100

hand_eye:
  # The GUI publishes here automatically only after held-out validation passes.
  calibration_path: data/calibrations/es68_left_ir_hand_eye_active.yaml
  minimum_samples: 15
  maximum_translation_rmse_m: 0.002
  maximum_rotation_rmse_deg: 0.5
  minimum_rotation_span_deg: 20.0
  minimum_translation_span_m: 0.03
  minimum_rotation_axis_diversity: 0.1
  # RTSI TCP is validation-only: calibrated FK·flange_T_tcp must agree before capture.
  maximum_fk_tcp_translation_error_m: 0.002
  maximum_fk_tcp_rotation_error_deg: 0.3
  minimum_novel_translation_m: 0.01
  minimum_novel_rotation_deg: 5.0
  validation_minimum_samples: 5
  validation_maximum_translation_rmse_m: 0.003
  validation_maximum_rotation_rmse_deg: 0.5
  validation_maximum_reprojection_rmse_px: 0.8
  require_quality_metrics: true
  require_observability_metrics: true
  initial_method: park
  enable_bundle_adjustment: true
  target:
    squares_x: 14
    squares_y: 9
    square_length_m: 0.020
    marker_length_m: 0.015
    dictionary: DICT_5X5_100
    legacy_pattern: false
    minimum_corners: 24
    maximum_reprojection_rmse_px: 0.8
    minimum_pose_ambiguity_ratio: 1.5
    detector_params:
      cornerRefinementMethod: 2
      adaptiveThreshWinSizeMin: 3
      adaptiveThreshWinSizeMax: 43
      adaptiveThreshWinSizeStep: 4

view_planning:
  # Left-IR optical-centre-to-patch-centre baseline. It remains null until the
  # real distance/accuracy experiment establishes a defensible value.
  standoff_distance_m: null
  # Fine views search per region around the baseline. Bounds must be supplied
  # together from the validated sensor/accuracy and workcell-clearance envelope.
  adaptive_standoff_enabled: true
  minimum_standoff_distance_m: null
  maximum_standoff_distance_m: null
  distance_search_step_m: 0.01
  overlap_fraction: 0.3
  footprint_utilization: 0.8
  image_edge_margin_px: 40
  minimum_patch_projection_fraction: 1.0
  minimum_patch_visibility_fraction: 0.90
  occlusion_depth_tolerance_m: 0.003
  maximum_visibility_split_depth: 2
  edge_margin_m: 0.005
  maximum_candidates: 200

view_filter:
  # Endpoint feasibility remains geometry-only until workspace and an IK checker exist.
  workspace: null
  forbidden_volumes: []
  camera_clearance_radius_m: 0.05
  minimum_look_at_cosine: 0.999
  minimum_incidence_cosine: 0.95
  maximum_standoff_error_m: 0.005
  duplicate_translation_tolerance_m: 0.005
  duplicate_rotation_tolerance_deg: 2.0

coverage:
  bins_per_axis: 8
  minimum_points_per_bin: 2
  completed_fraction: 0.8
  maximum_surface_distance_m: 0.02
  minimum_camera_side_offset_m: 0.02
  minimum_surface_points_per_view: 50

# Coarse-scan fusion keeps the robot/hand-eye pose as a strong prior. Residual ICP is
# bounded and performed only between observations assigned to the same blade side.
multi_view_fusion:
  voxel_size_m: 0.0015
  maximum_icp_points: 2500
  icp_iterations: 12
  maximum_correspondence_distance_m: 0.012
  minimum_correspondences: 80
  pose_prior_weight: 0.25
  maximum_translation_correction_m: 0.008
  maximum_rotation_correction_deg: 1.5
  normal_neighbors: 16

# Paper-derived true-surface partitioning. The usable footprint is the conservative
# workpiece-plane footprint after FOV, standoff, accuracy, and edge margins.
surface_partition:
  voxel_size_m: 0.0015
  maximum_points_per_side: 6000
  minimum_points_per_side: 150
  normal_neighbors: 16
  angle_criterion_threshold_deg: 90.0
  # AC candidates are ordered into a closed contour, divided at four topological
  # junctions, and fitted by endpoint-consistent robust cubic B-splines.
  boundary_curve_enabled: true
  # If real data cannot support four reliable curves, retain the earlier section-line
  # parameterization but record the fallback in the artifact metadata.
  boundary_allow_fallback: true
  boundary_angular_bins: 180
  boundary_min_points_per_curve: 10
  boundary_control_points: 10
  boundary_robust_iterations: 6
  boundary_smoothing_lambda: 0.1
  boundary_huber_delta_m: 0.003
  boundary_max_fit_rmse_m: 0.006
  boundary_min_inlier_fraction: 0.70
  boundary_band_fraction: 0.08
  overlap_fraction: 0.30
  # Production planning derives the footprint from calibrated left-IR intrinsics
  # and view_planning.standoff_distance_m. No fixed 80x60 mm fallback is allowed.
  derive_footprint_from_intrinsics: true
  usable_footprint_m: null
  minimum_patch_points: 24
  curvature_split_threshold_deg: 8.0
  maximum_adaptive_depth: 2
  normal_azimuth_bins: 24
  normal_elevation_bins: 12
  # This specimen has exactly one protruding fin in each main-blade half-space.
  # Detection is fail-closed so a fin cannot silently contaminate the main outline.
  fin_mode: required_single_per_side
  fin_height_fit_iterations: 6
  fin_height_huber_delta_m: 0.003
  fin_main_normal_min_cosine: 0.70
  fin_seed_max_normal_cosine: 0.55
  fin_seed_min_height_m: 0.008
  fin_grow_min_height_m: 0.0025
  fin_connectivity_radius_m: 0.006
  fin_minimum_points: 36
  fin_minimum_span_m: 0.012
  fin_maximum_thickness_ratio: 0.35
  fin_maximum_secondary_fraction: 0.35
  fin_root_band_m: 0.006
  fin_free_edge_band_m: 0.006
  fin_face_min_separation_m: 0.0015
  fin_root_view_main_weight: 0.75

# Front and back are integrated independently so their truncation bands cannot erase a
# wall thinner than twice the nominal TSDF truncation distance.
tsdf:
  voxel_size_m: 0.0015
  truncation_distance_m: 0.006
  minimum_weight: 1.0
  maximum_voxels: 2000000
  use_open3d_if_available: true
  thin_wall_band_fraction: 0.40

surface_quality:
  maximum_surface_distance_m: 0.004
  minimum_incidence_cosine: 0.35
  completed_fraction: 0.85
  maximum_rmse_m: 0.003
  minimum_normal_consistency: 0.75
  minimum_observed_points: 30

depth_comparison:
  minimum_overlap_points: 100
  # Report the fraction of shared blade pixels agreeing within each metric threshold.
  agreement_thresholds_m: [0.005, 0.01, 0.02]
  minimum_camera_side_offset_m: 0.02
  incidence_bin_edges_deg: [0, 15, 30, 45, 60, 75, 90]

kinematics:
  model_path: null
  plugin_path: null
  primary_timeout_ms: 1000
  ik_timeout_s: 0.05
  # Stage 1 keeps HoloRobot's calibrated ES68 chain fixed and applies no new zero offsets.
  joint_zero_offsets_rad: [0, 0, 0, 0, 0, 0]

# Collision validation refuses to run until measured/conservative geometry and joint
# limits are supplied in configs/local.yaml. Capsule 0 starts at the robot base;
# capsule 6 spans the flange/TCP to the camera center.
collision:
  link_radii_m: null
  camera_tool_radius_m: null
  minimum_joint_positions_rad: null
  maximum_joint_positions_rad: null
  obstacles: []
  require_obstacles: true
  minimum_clearance_m: 0.01
  maximum_joint_step_rad: 0.02

# HoloRobot-derived self-collision preflight and velocity-limited ServoJ generation.
# A clear report remains non-executable until the separate live approval gate runs.
motion_preflight:
  maximum_joint_step_rad: 0.02
  servoj_dt_s: 0.004
  speed_scaling: 0.08
  velocity_margin: 0.8
