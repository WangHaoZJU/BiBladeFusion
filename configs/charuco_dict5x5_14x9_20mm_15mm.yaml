schema_version: 1
type: charuco_board
name: charuco_dict5x5_14x9_20mm_15mm
notes:
  - "Physical board: DICT_5X5 dictionary, 14 columns x 9 rows squares, 20 mm square / 15 mm marker."
  - "OpenCV uses squares_x=columns, squares_y=rows; lengths are meters."
  - "If detection fails, confirm dictionary_name matches the printed board (DICT_5X5_100 vs DICT_5X5_250)."
squares_x: 14
squares_y: 9
square_length_m: 0.020
marker_length_m: 0.015
dictionary_name: DICT_5X5_100
legacy_pattern: false
minimum_corners_per_camera: 24
detector_params:
  cornerRefinementMethod: 2
  adaptiveThreshWinSizeMin: 3
  adaptiveThreshWinSizeMax: 43
  adaptiveThreshWinSizeStep: 4
physical_size_m:
  width_m: 0.280
  height_m: 0.180
  comment: "width = squares_x * square_length_m, height = squares_y * square_length_m"
