[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "biblade-fusion"
version = "0.1.0"
description = "Robot-guided bilateral 3D geometry and thermal reconstruction for thin-walled blades."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<2",
  "opencv-python-headless>=4.10,<5",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pin>=2.7,<3",
  "pyrealsense2>=2.54,<3",
  "pyyaml>=6.0,<7",
  "rich>=13.9,<15",
  "trimesh>=4,<5",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
calibration-gui = [
  "pyside6>=6.8,<7",
]
supervision-gui = [
  "pyside6>=6.8,<7",
]
robot-model-gui = [
  "pyside6>=6.8,<7",
]
tsdf-open3d = [
  "open3d>=0.18,<1",
]
foundation-stereo = [
  "einops>=0.8,<1",
  "huggingface-hub>=0.24,<2",
  "omegaconf>=2.3,<3",
  "scipy>=1.14,<2",
  "timm>=1.0,<2",
  "torch==2.4.1",
  "torchvision==0.19.1",
]
motion-ompl = [
  "ompl>=2.0,<3; platform_system != 'Windows'",
]

[project.scripts]
bbf = "biblade_fusion.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[tool.hatch.build]
exclude = [
  "/.uv-cache",
  "/third_party/FoundationStereo",
]

[tool.hatch.build.targets.wheel]
packages = ["src/biblade_fusion"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "hardware: requires connected physical hardware",
  "motion: may command physical robot motion",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
